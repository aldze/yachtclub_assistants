# Вставить в server { ... } существующего сайта ПЕРЕД «location / {».
# Ассистенты откроются по адресу https://<домен>/yachtsales/
location = /yachtsales { return 301 /yachtsales/; }

location /yachtsales/ {
    proxy_pass http://127.0.0.1:8097/;          # слеш в конце: /yachtsales/api/start → /api/start
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # последний адрес — посетитель
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;                     # ответ модели с инструментами бывает долгим
    client_max_body_size 64k;
}
